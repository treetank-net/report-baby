schema_version: 1
id: slides/title
kind: slide
surface: slide-16x9

canvas:
  direction: ltr

regions:
  hero:
    frame: { x: 0.06, y: 0.06, width: 0.88, height: 0.70 }

slots:
  lockup:
    type: lockup
    frame: { x: 0.06, y: 0.06, width: 0.03625, height: 0.0644444444 }
  image:
    type: image
    region: hero
    # This is the surface background, not a right-hand editorial figure.
    # It intentionally covers the canvas while hero remains the text safe area.
    frame: { x: 0.00, y: 0.00, width: 1.00, height: 1.00 }
  eyebrow:
    type: text
    region: hero
    frame: { x: 0.06, y: 0.23, width: 0.50, height: 0.06 }
    max_lines: 1
    overflow: reject
  title:
    type: text
    region: hero
    frame: { x: 0.06, y: 0.33, width: 0.50, height: 0.23 }
    role: heading-display
    max_lines: 2
    overflow: shrink-to-fit
  subtitle:
    type: text
    region: hero
    frame: { x: 0.06, y: 0.59, width: 0.50, height: 0.12 }
    role: body
    max_lines: 2
    overflow: shrink-to-fit

constraints:
  inside_canvas: true
  no_overlap: false
