schema_version: 1
showcase:
  meta:
    complexity: rich
    description: A high-contrast data brand with multiple surfaces, graphic cover art, mono typography and deliberate mode changes.
  reports:
    - id: light-report
      profile: surfaces/light
      template_ref: pages/showcase-report
      data:
        flows:
          title:
            continuation: forbidden
            blocks:
              - type: heading
                text: From signal to momentum
                role: title
                level: 1
              - type: text
                text: A light intelligence report surface
                role: subtitle
              - type: text
                text: Q2 2026
                role: eyebrow
          main:
            blocks:
              - type: text
                text: A data brand does not have to be dark; light mode can make dense analysis feel more open and operational.
                role: intro
                keep_with_next_lines: 2
              - type: metric
                label: Active teams
                value: 18.4k
                delta: +12.8%
                trend: up
                role: metric
              - type: metric
                label: Activation
                value: 64.2%
                delta: +6.4 pp
                trend: up
                role: metric
              - type: metric
                label: Expansion
                value: €2.8m
                delta: +18.1%
                trend: up
                role: metric
              - type: chart
                chart_type: line
                title: Weekly active teams
                subtitle: A steady climb
                data:
                  - label: W1
                    value: 11200
                  - label: W2
                    value: 12400
                  - label: W3
                    value: 13900
                  - label: W4
                    value: 15400
                  - label: W5
                    value: 18400
                role: chart
              - type: heading
                text: The product is becoming a habit
                role: heading
                level: 2
              - type: text
                text: A light surface can make complex evidence easier to scan while preserving the signal colour system.
                role: body
              - type: heading
                id: highlights-heading
                text: Highlights
                role: heading
                level: 2
              - type: list-item
                text: Keep the first result visible.
                role: body
              - type: list-item
                text: Turn successful workflows into team habits.
                role: body
          footer:
            blocks:
              - type: text
                text: Flux showcase · light report
                role: footer
    - id: dark-report
      profile: surfaces/dark
      template_ref: pages/showcase-report-band
      data:
        flows:
          title:
            continuation: forbidden
            blocks:
              - type: heading
                text: From signal to momentum
                role: title
                level: 1
              - type: text
                text: A dark intelligence report surface
                role: subtitle
              - type: text
                text: Q2 2026
                role: eyebrow
          main:
            blocks:
              - type: text
                text: Dark mode concentrates attention on the network, the signal and the next decision.
                role: intro
                keep_with_next_lines: 2
              - type: metric
                label: Active teams
                value: 18.4k
                delta: +12.8%
                trend: up
                role: metric
              - type: metric
                label: Activation
                value: 64.2%
                delta: +6.4 pp
                trend: up
                role: metric
              - type: metric
                label: Expansion
                value: €2.8m
                delta: +18.1%
                trend: up
                role: metric
              - type: chart
                chart_type: bar
                title: Where momentum comes from
                subtitle: Share of qualified pipeline
                data:
                  - label: Core
                    value: 42
                  - label: Automation
                    value: 28
                  - label: Collaboration
                    value: 19
                  - label: Regions
                    value: 11
                role: chart
              - type: heading
                text: Make the signal actionable
                role: heading
                level: 2
              - type: text
                text: A dark field lets cyan
                role: body
              - type: heading
                id: highlights-heading
                text: Highlights
                role: heading
                level: 2
              - type: list-item
                text: Use bright accents sparingly.
                role: body
              - type: list-item
                text: Keep body copy readable.
                role: body
          footer:
            blocks:
              - type: text
                text: Flux showcase · dark report
                role: footer
    - id: pagination-report
      profile: surfaces/light
      template_ref: pages/showcase-report
      data:
        flows:
          title:
            continuation: forbidden
            blocks:
              - type: heading
                text: The signal, page by page
                role: title
                level: 1
              - type: text
                text: A deliberately long report showing continuation pages
                role: subtitle
              - type: text
                text: Q2 2026
                role: eyebrow
          header:
            blocks:
              - type: text
                text: Q2 2026
                role: eyebrow
              - type: text
                text: The signal, page by page
                role: header
          main:
            blocks:
              - type: text
                text: This example is intentionally longer than one A4 page. It demonstrates how the same brand surface carries a narrative, a table and
                  supporting decisions across pages without losing its header, footer or reading order.
                role: intro
                keep_with_next_lines: 2
              - type: metric
                label: Active teams
                value: 18.4k
                delta: +12.8%
                trend: up
                role: metric
              - type: metric
                label: Activation
                value: 64.2%
                delta: +6.4 pp
                trend: up
                role: metric
              - type: metric
                label: Expansion
                value: €2.8m
                delta: +18.1%
                trend: up
                role: metric
              - type: chart
                chart_type: line
                title: Weekly active teams
                subtitle: The long-form report keeps its analytical anchor
                data:
                  - label: W1
                    value: 11200
                  - label: W2
                    value: 12400
                  - label: W3
                    value: 13900
                  - label: W4
                    value: 15400
                  - label: W5
                    value: 18400
                role: chart
              - type: heading
                text: What changed
                role: heading
                level: 2
                keep_with_next_lines: 2
              - type: text
                text: The first release reduced the distance between a team noticing a problem and acting on it. More teams now return to the same workspace during the week, which makes the signal easier to interpret and the next decision easier to share. This paragraph is long enough to exercise ordinary line wrapping without turning the page into a wall of text.
                role: body
              - type: heading
                text: Where the signal is strongest
                role: heading
                level: 2
                keep_with_next_lines: 2
              - type: text
                text: Adoption is strongest in teams that pair a clear first result with a repeatable weekly ritual. They do not need more controls; they need the important result to remain visible while the surrounding context becomes progressively richer. The report keeps that hierarchy stable as the story continues onto another page.
                role: body
              - type: heading
                text: What needs attention
                role: heading
                level: 2
                keep_with_next_lines: 2
              - type: text
                text: Expansion is moving in the right direction
                role: body
              - type: heading
                text: How to read the table
                role: heading
                level: 2
                keep_with_next_lines: 2
              - type: text
                text: The table below is deliberately long enough to cross a page boundary. Its headings should return on the continuation page, while the report chrome should make it clear that the reader is still inside the same branded document.
                role: body
              - type: table
                caption: Signals to carry into the next review
                head:
                  - Signal
                  - Movement
                  - Owner
                body:
                  - - First-result guidance
                    - +6.4 pp
                    - Product
                  - - Team ritual prompts
                    - +14%
                    - Lifecycle
                  - - Regional proof points
                    - €2.8m
                    - Growth
                  - - Shared workspace adoption
                    - +11%
                    - Product
                  - - First-week completion
                    - +8.2 pp
                    - Activation
                  - - Expansion readiness
                    - +18.1%
                    - Growth
                  - - Customer evidence loops
                    - +9.2 pp
                    - Research
                  - - Workflow handoffs
                    - -12 min
                    - Operations
                  - - Decision review cadence
                    - +2 cycles
                    - Leadership
                  - - Signal-to-action time
                    - -18%
                    - Product
                  - - Repeat usage quality
                    - +7.4 pp
                    - Lifecycle
                  - - Regional enablement
                    - +16%
                    - Growth
                  - - Onboarding completion
                    - +10.1 pp
                    - Activation
                  - - Qualified workspace depth
                    - +13%
                    - Product
                  - - Evidence reuse
                    - +21%
                    - Research
                  - - Review preparation time
                    - -24 min
                    - Operations
                  - - Cross-team handoffs
                    - +6.8 pp
                    - Lifecycle
                  - - Decision confidence
                    - +9.7 pp
                    - Leadership
                  - - Local proof points
                    - +12%
                    - Growth
                  - - Workflow consistency
                    - +15%
                    - Product
                  - - Support deflection
                    - -8.4%
                    - Operations
                  - - Activation after week four
                    - +5.9 pp
                    - Activation
                  - - Expansion conversation rate
                    - +14%
                    - Growth
                  - - Reusable insight blocks
                    - +18%
                    - Research
                role: table
              - type: heading
                id: highlights-heading
                text: Highlights
                role: heading
                level: 2
                keep_with_next_lines: 2
              - type: list-item
                text: Keep the first result visible.
                role: body
              - type: list-item
                text: Turn successful workflows into team habits.
                role: body
              - type: list-item
                text: Let every continuation page preserve the context needed to act.
                role: body
          footer:
            blocks:
              - type: text
                text: Flux showcase · pagination report
                role: footer
  decks:
    - id: mixed-surfaces
      footer: Flux showcase · Q2 2026
      slides:
        - layout: title
          template_ref: slides/title
          brand_ref: brand://flux/surfaces/graphic
          flows:
            title:
              blocks:
                - type: heading
                  text: From signal to momentum
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: Network graphic cover with a high-energy data field
                  role: subtitle
            eyebrow:
              blocks:
                - type: text
                  text: Q2 2026 / PRODUCT SIGNALS
                  role: eyebrow
        - layout: metrics
          template_ref: slides/metrics-3
          brand_ref: brand://flux/surfaces/light
          flows:
            title:
              blocks:
                - type: heading
                  text: The light signal board
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: Open analysis surface with mono typography
                  role: subtitle
            main:
              blocks:
                - type: metric
                  label: Active teams
                  value: 18.4k
                  delta: +12.8%
                  trend: up
                  role: metric
                - type: metric
                  label: Activation
                  value: 64.2%
                  delta: +6.4 pp
                  trend: up
                  role: metric
                - type: metric
                  label: Expansion
                  value: €2.8m
                  delta: +18.1%
                  trend: up
                  role: metric
            body:
              blocks:
                - type: text
                  text: The light mode keeps the data readable while the monospace voice makes the system feel instrumented.
                  role: body
            callout:
              blocks:
                - type: text
                  text: Rich brand contract · the same signal can move between analytical modes
                  role: quote
        - layout: chart
          brand_ref: brand://flux/surfaces/dark
          flows:
            title:
              blocks:
                - type: heading
                  text: The dark signal board
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: Neon accents on a deep field
                  role: subtitle
            main:
              blocks:
                - type: chart
                  chart_type: line
                  data:
                    - label: W1
                      value: 11200
                    - label: W2
                      value: 12400
                    - label: W3
                      value: 13900
                    - label: W4
                      value: 15400
                    - label: W5
                      value: 18400
