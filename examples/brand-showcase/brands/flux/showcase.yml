          flows:
            title:
              blocks:
                - type: heading
                  text: A gray editorial surface
                  role: title
                  level: 1
            main:
              blocks:
                - type: text
                  text: Gray can turn down the intensity when the story needs interpretation rather than a dashboard moment.
                  role: body
                - type: list-item
                  text: Use quiet contrast for explanation.
                  role: body
                - type: list-item
                  text: Keep the signal hierarchy explicit.
                  role: body
        - layout: table
          brand_ref: brand://flux/surfaces/accent
          flows:
            title:
              blocks:
                - type: heading
                  text: An accent surface for decisions
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: Violet carries the decision moment
                  role: subtitle
            main:
              blocks:
                - type: table
                  head:
                    - Bet
                    - Signal
                    - Owner
                  body:
                    - - First-result guidance
                      - +6.4 pp
                      - Product
                    - - Team ritual prompts
                      - +14%
                      - Lifecycle
                    - - Regional proof points
                      - €2.8m
                      - Growth
                    - - More signal
                      - +9.2 pp
                      - Product
                    - - Less noise
                      - -18%
                      - Analytics
                    - - Shared context
                      - +11%
                      - Teams
                  role: table
        - layout: conclusions
          brand_ref: brand://flux/surfaces/light
          flows:
            title:
              blocks:
                - type: heading
                  text: Make momentum repeatable
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: Return to the open light surface for the close
                  role: subtitle
            main:
              blocks:
                - type: list-item
                  text: Shorten the path to first value.
                  role: body
                - type: list-item
                  text: Make collaboration natural.
                  role: body
                - type: list-item
                  text: Let evidence lead the expansion story.
                  role: body
