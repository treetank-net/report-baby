schema_version: 1
showcase:
  meta:
    complexity: basic
    description: One dependable editorial surface; the brand is intentionally useful rather than decorative.
  reports:
    - id: primary-report
      profile: primary
      template_ref: pages/showcase-report
      data:
        flows:
          title:
            blocks:
              - type: heading
                text: From signal to momentum
                role: title
                level: 1
              - type: text
                text: A straightforward product report
                role: subtitle
              - type: text
                text: Q2 2026
                role: eyebrow
          main:
            blocks:
              - type: text
                text: "Orbit is the deliberately basic fixture: one surface, one logo lockup, one readable palette and no generated variants that the brand
                  did not define."
                role: intro
                keep_with_next_lines: 2
              - type: metric
                label: Active teams
                value: 18.4k
                delta: +12.8%
                trend: up
                role: metric
              - type: metric
                label: Activation
                value: 64.2%
                delta: +6.4 pp
                trend: up
                role: metric
              - type: metric
                label: Expansion
                value: €2.8m
                delta: +18.1%
                trend: up
                role: metric
              - type: chart
                chart_type: line
                title: Weekly active teams
                subtitle: A steady climb
                data:
                  - label: W1
                    value: 11200
                  - label: W2
                    value: 12400
                  - label: W3
                    value: 13900
                  - label: W4
                    value: 15400
                  - label: W5
                    value: 18400
                role: chart
              - type: heading
                text: The product is becoming a habit
                role: heading
                level: 2
              - type: text
                text: Teams that complete the first workflow return more often and invite colleagues sooner.
                role: body
              - type: heading
                id: highlights-heading
                text: Highlights
                role: heading
                level: 2
              - type: list-item
                text: Keep the first result visible.
                role: body
              - type: list-item
                text: Turn successful workflows into team habits.
                role: body
          footer:
            blocks:
              - type: text
                text: Orbit showcase · basic report
                role: footer
  decks:
    - id: primary-surface
      profile: primary
      slides:
        - layout: title
          brand_ref: brand://orbit/primary
          flows:
            title:
              blocks:
                - type: heading
                  text: From signal to momentum
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: One clear surface is enough when the brand has a disciplined hierarchy.
                  role: subtitle
            eyebrow:
              blocks:
                - type: text
                  text: Q2 2026 / PRODUCT SIGNALS
                  role: eyebrow
        - layout: metrics
          brand_ref: brand://orbit/primary
          flows:
            title:
              blocks:
                - type: heading
                  text: The primary signal board
                  role: title
                  level: 1
            subtitle:
              blocks:
                - type: text
                  text: No artificial theme variants
                  role: subtitle
            main:
              blocks:
                - type: metric
                  label: Active teams
                  value: 18.4k
                  delta: +12.8%
                  trend: up
                  role: metric
                - type: metric
                  label: Activation
                  value: 64.2%
                  delta: +6.4 pp
                  trend: up
                  role: metric
                - type: metric
                  label: Expansion
                  value: €2.8m
                  delta: +18.1%
                  trend: up
                  role: metric
            body:
              blocks:
                - type: text
                  text: "This deck is intentionally small: it demonstrates that a simple brand stays simple in the example output."
                  role: body
            callout:
              blocks:
                - type: text
                  text: Basic brand contract · one surface · one dependable hierarchy
                  role: quote
        - layout: narrative
          brand_ref: brand://orbit/primary
          flows:
            title:
              blocks:
                - type: heading
                  text: A useful default
                  role: title
                  level: 1
            main:
              blocks:
                - type: text
                  text: A basic brand should not be inflated with dark modes
                  role: body
                - type: list-item
                  text: The renderer follows the brand.
                  role: body
                - type: list-item
                  text: Missing definitions stay missing.
                  role: body
                - type: list-item
                  text: Complexity comes from the brandbook.
                  role: body
