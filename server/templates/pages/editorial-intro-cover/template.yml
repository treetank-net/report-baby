schema_version: 1
id: pages/editorial-intro-cover
kind: page
surface: pdf-a4
archetype: narrative
canvas:
  direction: ltr
page:
  width: 210
  height: 297
  margins: { top: 18, right: 17, bottom: 18, left: 17 }
  columns:
    count: 1
    gutter: 0
  reserved_bands:
    footer: { x: 0, y: 0.93, width: 1, height: 0.07 }
  flow:
    align: left
    hyphenate: true
slots:
  header-lockup:
    type: lockup
    frame: { x: 0.081, y: 0.02, width: 0.34, height: 0 }
    fit_content: true
    role: header
  header:
    type: text
    frame: { x: 0.081, y: 0.06, width: 0.838, height: 0 }
    fit_content: true
    grow: { axis: y, max_height: 0.18, pushes: [intro-image, intro-lead] }
    role: header
  intro-image:
    type: image
    frame: { x: 0.081, y: 0.10, width: 0.838, height: 0 }
    fit_content: true
    grow: { axis: y, pushes: [intro-lead, content] }
    role: intro
    allowed_block_kinds: [image]
  intro-lead:
    type: text
    # Start empty and grow to the measured lead. The lead pushes the main
    # content slot so the first page can continue below the intro.
    frame: { x: 0.081, y: 0.10, width: 0.838, height: 0 }
    fit_content: true
    grow: { axis: y, pushes: [content] }
    role: intro
    allowed_block_kinds: [paragraph]
  content:
    type: text
    # Leave the configured body gap after the measured intro lead.
    frame: { x: 0.081, y: 0.16, width: 0.838, height: 0.77 }
  footer:
    type: text
    frame: { x: 0.081, y: 0.93, width: 0.838, height: 0.04 }
flows:
  header:
    slots: [header-lockup, header]
    priority: 500
    continuation: forbidden
    repeat: each-page
  intro:
    slots: [intro-image, intro-lead]
    priority: 400
    continuation: forbidden
  main:
    slots: [content]
    priority: 200
    continuation: allowed
  footer:
    slots: [footer]
    priority: 500
    continuation: forbidden
    repeat: each-page
constraints:
  inside_canvas: true
  no_overlap: false
