schema_version: 1
id: pages/editorial-inset-two-column
kind: page
surface: pdf-a4
archetype: columns
composition:
  heading_keep_with_next_lines: 1
canvas:
  direction: ltr
page:
  width: 210
  height: 297
  margins: { top: 18, right: 17, bottom: 18, left: 17 }
  columns:
    count: 2
    gutter: 6
    widths: [85, 85]
  reserved_bands:
    header: { x: 0, y: 0, width: 1, height: 0.1235 }
    footer: { x: 0, y: 0.93, width: 1, height: 0.07 }
  flow:
    align: left
    hyphenate: true
slots:
  # Header text is a fit-content slot.  The small baseline keeps the existing
  # two-line editorial rhythm; longer titles grow up to the configured cap and
  # push the intro and continuation columns instead of leaving a fixed band.
  header:
    type: text
    frame: { x: 0.081, y: 0.06, width: 0.838, height: 0.0435 }
    role: header
    fit_content: true
    grow: { axis: y, max_height: 0.18, pushes: [intro, content] }
  intro:
    type: text
    # Start below the baseline header; header growth moves this slot further.
    frame: { x: 0.081, y: 0.1465, width: 0.838, height: 0.05 }
    role: intro
    allowed_block_kinds: [paragraph, image]
    fit_content: true
    grow: { axis: y, pushes: [content] }
  quote-a:
    type: text
    frame: { x: 0.081, y: 0.34, width: 0.838, height: 0.045 }
    role: quote
    vertical_align: middle
    fit_content: true
    grow: { axis: y, max_height: 0.12 }
  quote-b:
    type: text
    frame: { x: 0.081, y: 0.52, width: 0.838, height: 0.045 }
    role: quote
    vertical_align: middle
    fit_content: true
    grow: { axis: y, max_height: 0.12 }
  quote-c:
    type: text
    frame: { x: 0.081, y: 0.70, width: 0.838, height: 0.045 }
    role: quote
    vertical_align: middle
    fit_content: true
    grow: { axis: y, max_height: 0.12 }
  content:
    type: text
    frame: { x: 0.081, y: 0.25, width: 0.838, height: 0.68 }
  footer:
    type: text
    frame: { x: 0.081, y: 0.93, width: 0.838, height: 0.04 }
flows:
  header:
    slots: [header]
    continuation: forbidden
    repeat: each-page
  intro:
    slots: [intro]
    continuation: forbidden
  main:
    slots: [content]
    continuation: allowed
  quotes:
    slots: [quote-a, quote-b, quote-c]
    insertion_slots: [quote-a, quote-b, quote-c]
    start_page: 2
    continuation: allowed
  footer:
    slots: [footer]
    continuation: forbidden
    repeat: each-page
constraints:
  inside_canvas: true
  no_overlap: false
